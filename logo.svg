<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2b2118"/>
      <stop offset="1" stop-color="#0d0a07"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b0"/>
      <stop offset="0.45" stop-color="#e2b13c"/>
      <stop offset="1" stop-color="#7a5414"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e2b3"/>
      <stop offset="1" stop-color="#c9a86a"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8cf95"/>
      <stop offset="0.5" stop-color="#b48a4a"/>
      <stop offset="1" stop-color="#6e4f25"/>
    </linearGradient>
    <radialGradient id="coin" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.5" stop-color="#e8b83e"/>
      <stop offset="1" stop-color="#8a5f12"/>
    </radialGradient>
  </defs>

  <!-- frame -->
  <rect x="6" y="6" width="388" height="388" rx="34" fill="url(#bg)"/>
  <rect x="6" y="6" width="388" height="388" rx="34" fill="none" stroke="url(#gold)" stroke-width="12"/>
  <rect x="22" y="22" width="356" height="356" rx="24" fill="none" stroke="#e2b13c" stroke-opacity="0.35" stroke-width="2"/>

  <!-- scroll -->
  <g transform="rotate(-6 190 200)">
    <rect x="92" y="78" width="196" height="236" rx="6" fill="url(#paper)" stroke="#5a3d18" stroke-width="4"/>
    <rect x="80" y="62" width="220" height="30" rx="15" fill="url(#roll)" stroke="#4a3112" stroke-width="4"/>
    <rect x="80" y="300" width="220" height="30" rx="15" fill="url(#roll)" stroke="#4a3112" stroke-width="4"/>

    <!-- checklist rows -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <rect x="114" y="116" width="30" height="30" rx="5" fill="#fff6dc" stroke="#5a3d18" stroke-width="4"/>
      <path d="M119 131 l8 9 l18 -24" fill="none" stroke="#2f8f2f" stroke-width="8"/>
      <line x1="158" y1="131" x2="264" y2="131" stroke="#6b4a22" stroke-width="9" opacity="0.55"/>

      <rect x="114" y="170" width="30" height="30" rx="5" fill="#fff6dc" stroke="#5a3d18" stroke-width="4"/>
      <path d="M119 185 l8 9 l18 -24" fill="none" stroke="#2f8f2f" stroke-width="8"/>
      <line x1="158" y1="185" x2="244" y2="185" stroke="#6b4a22" stroke-width="9" opacity="0.55"/>

      <rect x="114" y="224" width="30" height="30" rx="5" fill="#fff6dc" stroke="#5a3d18" stroke-width="4"/>
      <line x1="158" y1="239" x2="256" y2="239" stroke="#6b4a22" stroke-width="9"/>
    </g>
  </g>

  <!-- coin stack -->
  <g stroke="#4a3008" stroke-width="4">
    <ellipse cx="300" cy="318" rx="58" ry="20" fill="#8a5f12"/>
    <rect x="242" y="300" width="116" height="18" fill="#a8761c" stroke="none"/>
    <ellipse cx="300" cy="300" rx="58" ry="20" fill="url(#coin)"/>
    <ellipse cx="300" cy="284" rx="58" ry="20" fill="#8a5f12"/>
    <rect x="242" y="266" width="116" height="18" fill="#a8761c" stroke="none"/>
    <ellipse cx="300" cy="266" rx="58" ry="20" fill="url(#coin)"/>
    <circle cx="306" cy="212" r="50" fill="url(#coin)"/>
    <circle cx="306" cy="212" r="38" fill="none" stroke="#8a5f12" stroke-width="4"/>
  </g>
  <text x="306" y="228" text-anchor="middle" font-family="DejaVu Serif" font-weight="bold" font-size="44" fill="#6b4410">g</text>

  <!-- T0.5 banner -->
  <path d="M40 336 h150 l-14 20 l14 20 h-150 l14 -20 z" fill="#5c1a12" stroke="url(#gold)" stroke-width="4"/>
  <text x="115" y="368" text-anchor="middle" font-family="DejaVu Serif" font-weight="bold" font-size="32" fill="url(#gold)" stroke="#2a0d08" stroke-width="1.5">T0.5</text>
</svg>
